services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dayspark
      POSTGRES_PASSWORD: "AyWFyVAD2hFYNIpcaxEI6rropdylW1rZ"
    volumes:
      - dayspark_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "hOb5gmQN_7u4tdj5UOOfIulb0KkkY1m7"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dayspark_test
      POSTGRES_PASSWORD: "5gvr_eorDy04i_h1fSpV8-CJtLl3YTFd"
    volumes:
      - dayspark_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "UnybdWfmuQzAuSJIE7GPcEy1_b7ZHgkX"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  dayspark_data:
  dayspark_test_data:
